name: ClubNou Autonomous AI Post Generator

on:
  schedule:
    # 2 fwa pa jou: 6:00 AM ak 4:00 PM Lè Ayiti (UTC-4) -> 10:00 & 20:00 UTC
    - cron: '0 10,20 * * *'
  # Pèmèt deklanchman manyèl depi koòdone GitHub Actions la ("Run workflow")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Rekipere Kòd Sous la (Checkout)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⚙️ Enstale Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Enstale Depandans yo
        run: npm install

      - name: 🤖 Egzekite Script AI ClubNou (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-post.js

      - name: 🚀 Konfigire Git epi Pouse Nouvo Atik la
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ajoute fichye atik yo
          git add data/articles.json
          if [ -f public/data/articles.json ]; then
            git add public/data/articles.json
          fi
          
          # Tcheke si gen chanjman pou komèt
          if git diff --staged --quiet; then
            echo "Pa gen nouvo chanjman pou pibliye."
          else
            git commit -m "Auto: Nouvo atik ClubNou pibliye pa AI [skip ci]"
            git push origin HEAD:${{ github.ref }} || git push
            echo "✅ Nouvo atik la pouse avèk siksè sou GitHub! Netlify ap deplwaye l touswit."
          fi
